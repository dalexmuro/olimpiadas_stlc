<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 580">
  <defs>
    <linearGradient id="ol-flame-outer" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#E79326"/>
      <stop offset="65%" stop-color="#E89525"/>
      <stop offset="100%" stop-color="#DC7A22"/>
    </linearGradient>
    <linearGradient id="ol-flame-dark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#DF6F23"/>
      <stop offset="100%" stop-color="#D45B20"/>
    </linearGradient>
    <linearGradient id="ol-flame-mid" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F6CE42"/>
      <stop offset="55%" stop-color="#F2B432"/>
      <stop offset="100%" stop-color="#E88B24"/>
    </linearGradient>
    <linearGradient id="ol-flame-inner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F5AB2E"/>
      <stop offset="100%" stop-color="#E27522"/>
    </linearGradient>
    <radialGradient id="ol-flame-core" cx="50%" cy="68%" r="55%" fx="50%" fy="68%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="35%" stop-color="#FCF3C0"/>
      <stop offset="70%" stop-color="#F7DB72"/>
      <stop offset="100%" stop-color="#F1B842"/>
    </radialGradient>
    <g id="ol-feather-outline">
      <path fill="none" stroke="#1B1917" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"
        d="M 0 12 C -4 -6, -15 -22, -15 -46 C -15 -62, -11 -74, -5 -84 L -9 -68 L -3 -73 C -1 -84, -1 -94, 0 -102 C 8 -86, 15 -66, 14 -44 C 13 -22, 4 -6, 0 12 Z"/>
      <path fill="none" stroke="#1B1917" stroke-width="2.4" stroke-linecap="round"
        d="M 0 18 C -0.5 -20, -0.5 -56, 0 -94"/>
    </g>
    <g id="ol-wreath-side">
      <path fill="none" stroke="#1B1917" stroke-width="3.2" stroke-linecap="round"
        d="M 186 428 C 112 356, 102 224, 210 126"/>
      <use href="#ol-feather-outline" transform="translate(164 404) rotate(-58) scale(0.86)"/>
      <use href="#ol-feather-outline" transform="translate(138 352) rotate(-38) scale(0.90)"/>
      <use href="#ol-feather-outline" transform="translate(124 292) rotate(-16) scale(0.92)"/>
      <use href="#ol-feather-outline" transform="translate(130 232) rotate(6) scale(0.88)"/>
      <use href="#ol-feather-outline" transform="translate(154 178) rotate(28) scale(0.84)"/>
      <use href="#ol-feather-outline" transform="translate(196 138) rotate(52) scale(0.78)"/>
      <use href="#ol-feather-outline" transform="translate(178 408) rotate(-8) scale(0.68)"/>
      <use href="#ol-feather-outline" transform="translate(152 354) rotate(8) scale(0.70)"/>
      <use href="#ol-feather-outline" transform="translate(140 294) rotate(26) scale(0.70)"/>
      <use href="#ol-feather-outline" transform="translate(148 236) rotate(46) scale(0.66)"/>
      <use href="#ol-feather-outline" transform="translate(176 184) rotate(66) scale(0.62)"/>
    </g>
